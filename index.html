<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUSION | Production Co.</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* CHROME TEXTURE BACKGROUND */
            background-color: #999;
            background-image: 
                linear-gradient(115deg, rgba(255,255,255,0.8) 0%, rgba(150,150,150,0.2) 20%, rgba(255,255,255,0.8) 40%, rgba(100,100,100,0.5) 60%, rgba(255,255,255,0.8) 80%, rgba(150,150,150,0.2) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-blend-mode: overlay;
            background-attachment: fixed;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        /* NAVIGATION - SCROLLS AWAY */
        .nav-header {
            position: absolute; /* Changed from fixed to absolute */
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .logo {
            width: 476px; /* 1.7x Size */
            height: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 50px;
            padding-top: 15px;
        }

        .nav-link {
            text-decoration: none;
            color: #ffffff;
            font-size: 22.4px; /* 1.4x Size */
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: opacity 0.3s;
        }

        .nav-link:hover {
            opacity: 0.5;
        }

        /* MAIN CONTENT */
        .main {
            padding: 500px 60px 100px;
            max-width: 1600px;
        }

        .film {
            font-size: clamp(32px, 5vw, 64px);
            padding: 40px 0;
            text-transform: uppercase;
            font-weight: 700;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            transition: 0.4s;
            cursor: pointer;
        }

        .film:hover {
            color: #ffffff;
            transform: translateX(20px);
            text-shadow: 0 0 30px rgba(255,255,255,0.6);
        }

        .year {
            font-size: 0.3em;
            margin-left: 15px;
            opacity: 0.4;
        }

        /* TEAM SECTION */
        .team-section {
            padding: 120px 60px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 60px;
            margin-top: 60px;
        }

        .member-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            filter: grayscale(100%);
            transition: 0.5s;
            margin-bottom: 20px;
        }

        .member-card:hover img {
            filter: grayscale(0%);
        }

        .portfolio-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 2px;
        }

        /* PREVIEW POPUP */
        #preview {
            position: fixed;
            width: 500px;
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            transition: opacity 0.3s;
        }

        .footer {
            padding: 100px 60px;
            text-align: center;
            opacity: 0.5;
        }

        @media(max-width: 900px) {
            .logo { width: 280px; }
            .main { padding-top: 300px; }
        }
    </style>
</head>
<body>

    <nav class="nav-header">
        <img src="images/Fusionlogo_v2.png" alt="FUSION" class="logo">
        <div class="nav-links">
            <a href="#team" class="nav-link">TEAM</a>
            <a href="#footer-contact" class="nav-link">CONTACT</a>
        </div>
    </nav>

    <div class="main">
        <div class="film" data-img="images/RaymondLeigh.png">Raymond Leigh <span class="year">2026</span></div>
        <div class="film" data-img="images/Arlo.png">Arlo <span class="year">2025</span></div>
        <div class="film" data-img="images/Mutek.png">MUTEK <span class="year">2024</span></div>
    </div>

    <section class="team-section" id="team">
        <h2 style="font-size: 48px;">TEAM</h2>
        <div class="team-grid">
            <div class="member-card">
                <img src="images/jeremie.jpg" alt="Jérémie">
                <h3>Jérémie Urbain</h3>
                <p>Creative Director & Cinematographer</p>
                <a href="#" class="portfolio-btn">Portfolio</a>
            </div>
            <div class="member-card">
                <img src="images/samuel.jpg" alt="Samuel">
                <h3>Samuel Brichet</h3>
                <p>Lead Editor & Motion Design</p>
                <a href="#" class="portfolio-btn">Portfolio</a>
            </div>
            <div class="member-card">
                <img src="images/alec.jpg" alt="Alec">
                <h3>Alec Nikoghossian</h3>
                <p>Producer & Sound Design</p>
                <a href="#" class="portfolio-btn">Portfolio</a>
            </div>
        </div>
    </section>

    <div class="footer" id="footer-contact">filmbyfusion@gmail.com</div>

    <img id="preview" src="" alt="">

    <script>
        const preview = document.getElementById('preview');
        const films = document.querySelectorAll('.film');

        window.addEventListener('mousemove', (e) => {
            if (preview.style.opacity === '1') {
                preview.style.left = (e.clientX + 30) + 'px';
                preview.style.top = (e.clientY - preview.offsetHeight / 2) + 'px';
            }
        });

        films.forEach(film => {
            film.addEventListener('mouseenter', () => {
                preview.src = film.getAttribute('data-img');
                preview.style.opacity = '1';
            });
            film.addEventListener('mouseleave', () => {
                preview.style.opacity = '0';
            });
        });
    </script>
</body>
</html>
