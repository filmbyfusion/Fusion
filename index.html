<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUSION | Production Co.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Futura, "Futura PT", "Helvetica Neue", Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
            cursor: none; 
        }

        body {
            /* SHINY CHROME GRADIENT */
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, #d1d1d6 45%, #8e8e93 100%);
            background-attachment: fixed;
            color: #000; /* Black text looks better on Chrome than white */
            overflow-x: hidden;
        }

        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 18px solid #000; /* Black cursor to match text */
            transform: rotate(-30deg);
            pointer-events: none;
            z-index: 9999;
        }

        .nav {
            position: fixed;
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        /* LOGO: 1.7x size (476px) */
        .logo {
            width: 476px; 
            height: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-link {
            text-decoration: none;
            color: inherit;
            font-size: 18px;
            letter-spacing: 3px;
            transition: 0.3s;
            opacity: 0.8;
            font-weight: 600;
        }

        /* TEAM & CONTACT hover color matches Film Titles */
        .nav-link:hover {
            opacity: 1;
            color: #ff2bd6; 
        }

        .main {
            padding: 450px 60px 100px; /* Extra padding for the massive logo */
            width: 60%;
        }

        .film-link {
            text-decoration: none;
            color: inherit;
        }

        .film {
            font-size: 42px;
            padding: 25px 0;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), color 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .film:hover {
            color: #ff2bd6; 
            transform: translateX(20px);
        }

        .year {
            font-size: 14px;
            margin-left: 15px;
            opacity: .5;
        }

        .preview {
            position: fixed;
            width: 500px;
            pointer-events: none;
            opacity: 0;
            transition: opacity .2s ease-out;
            z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .preview img {
            width: 100%;
            display: block;
        }

        .footer {
            padding: 200px 60px 100px;
            font-size: 14px;
            letter-spacing: 3px;
        }

        @media(max-width:900px) {
            .logo { width: 250px; } 
            .main { padding-top: 250px; }
            .preview { display: none; }
            html, body { cursor: auto; }
            #custom-cursor { display: none; }
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <div class="nav">
        <img src="images/Fusionlogo_v2.png" alt="FUSION" class="logo">
        
        <div class="nav-links">
            <a href="#team" class="nav-link">TEAM</a>
            <a href="#footer-contact" class="nav-link">CONTACT</a>
        </div>
    </div>

    <div class="main">
        <a href="https://www.youtube.com/watch?v=cB0-g6u-kO4" target="_blank" class="film-link">
            <div class="film" data-img="images/RaymondLeigh.png">
                Raymond Leigh <span class="year">2026</span>
            </div>
        </a>
        <a href="https://vimeo.com/1122986082" target="_blank" class="film-link">
            <div class="film" data-img="images/Arlo.png">
                Arlo <span class="year">2025</span>
            </div>
        </a>
        <a href="https://www.youtube.com/watch?v=rN5POyiLMTM" target="_blank" class="film-link">
            <div class="film" data-img="images/Mutek.png">
                MUTEK <span class="year">2024</span>
            </div>
        </a>
    </div>

    <div class="preview" id="preview">
        <img src="" alt="">
    </div>

    <div class="footer" id="footer-contact">
        <p id="team" style="margin-bottom: 40px; opacity: 0.5;">TEAM SECTION CONTENT GOES HERE</p>
        filmbyfusion@gmail.com
    </div>

    <script>
        const cursor = document.getElementById('custom-cursor');
        const preview = document.getElementById('preview');
        const previewImg = preview.querySelector('img');
        const films = document.querySelectorAll('.film');

        window.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            requestAnimationFrame(() => {
                if (cursor) {
                    cursor.style.left = x + 'px';
                    cursor.style.top = y + 'px';
                }
                if (preview && preview.style.opacity === '1') {
                    const yOffset = preview.offsetHeight / 2;
                    preview.style.left = (x + 45) + 'px';
                    preview.style.top = (y - yOffset) + 'px';
                }
            });
        });

        films.forEach(film => {
            film.addEventListener('mouseenter', () => {
                previewImg.src = film.getAttribute('data-img');
                preview.style.opacity = '1';
            });
            film.addEventListener('mouseleave', () => {
                preview.style.opacity = '0';
            });
        });
    </script>
</body>
</html>
