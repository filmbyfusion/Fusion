<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUSION | Production Co.</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Applied Poppins globally */
            font-family: 'Poppins', sans-serif;
        }

        html {
            scroll-behavior: smooth;
            cursor: auto; /* Default cursor restored */
        }

        body {
            /* SHINY CHROME WITH BRUSHED TEXTURE */
            background: 
                linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(135deg, #e0e0e2 0%, #b8b8ba 25%, #d1d1d3 50%, #959597 75%, #c0c0c2 100%);
            background-size: 4px 4px, 4px 4px, 100% 100%;
            background-attachment: fixed;
            color: #1a1a1a; /* Deep charcoal for readability on chrome */
            overflow-x: hidden;
        }

        .nav {
            position: fixed;
            width: 100%;
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            /* Subtle glassmorphism so nav stays visible during scroll */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }

        /* LOGO: 1.7x size */
        .logo {
            width: 476px; 
            height: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-link {
            text-decoration: none;
            color: inherit;
            font-size: 16px;
            letter-spacing: 2px;
            transition: 0.3s;
            opacity: 0.7;
            font-weight: 600;
        }

        /* Hover: White instead of Pink */
        .nav-link:hover {
            opacity: 1;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .main {
            padding: 450px 60px 100px;
            width: 60%;
        }

        .film-link {
            text-decoration: none;
            color: inherit;
        }

        .film {
            font-size: 48px;
            padding: 30px 0;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        /* Hover: White instead of Pink */
        .film:hover {
            color: #ffffff; 
            transform: translateX(15px);
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        .year {
            font-size: 14px;
            margin-left: 15px;
            opacity: .5;
            font-weight: 300;
        }

        .preview {
            position: fixed;
            width: 520px;
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s ease;
            z-index: 100;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .preview img {
            width: 100%;
            display: block;
        }

        .footer {
            padding: 150px 60px 80px;
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 400;
        }

        @media(max-width:900px) {
            .logo { width: 280px; } 
            .main { padding-top: 250px; width: 90%; }
            .film { font-size: 32px; }
            .preview { display: none; }
        }
    </style>
</head>
<body>

    <div class="nav">
        <img src="images/Fusionlogo_v2.png" alt="FUSION" class="logo">
        
        <div class="nav-links">
            <a href="#team" class="nav-link">TEAM</a>
            <a href="#footer-contact" class="nav-link">CONTACT</a>
        </div>
    </div>

    <div class="main">
        <a href="https://www.youtube.com/watch?v=cB0-g6u-kO4" target="_blank" class="film-link">
            <div class="film" data-img="images/RaymondLeigh.png">
                Raymond Leigh <span class="year">2026</span>
            </div>
        </a>
        <a href="https://vimeo.com/1122986082" target="_blank" class="film-link">
            <div class="film" data-img="images/Arlo.png">
                Arlo <span class="year">2025</span>
            </div>
        </a>
        <a href="https://www.youtube.com/watch?v=rN5POyiLMTM" target="_blank" class="film-link">
            <div class="film" data-img="images/Mutek.png">
                MUTEK <span class="year">2024</span>
            </div>
        </a>
    </div>

    <div class="preview" id="preview">
        <img src="" alt="Preview">
    </div>

    <div class="footer" id="footer-contact">
        <div id="team" style="margin-bottom: 40px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 40px;">
            <h3 style="margin-bottom: 10px;">TEAM</h3>
            <p style="opacity: 0.6;">Production Collective</p>
        </div>
        <p>filmbyfusion@gmail.com</p>
    </div>

    <script>
        const preview = document.getElementById('preview');
        const previewImg = preview.querySelector('img');
        const films = document.querySelectorAll('.film');

        // Track mouse for the preview image
        window.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            requestAnimationFrame(() => {
                if (preview && preview.style.opacity === '1') {
                    const yOffset = preview.offsetHeight / 2;
                    preview.style.left = (x + 40) + 'px';
                    preview.style.top = (y - yOffset) + 'px';
                }
            });
        });

        // Hover logic for Previews
        films.forEach(film => {
            film.addEventListener('mouseenter', () => {
                const imgPath = film.getAttribute('data-img');
                previewImg.src = imgPath;
                preview.style.opacity = '1';
            });
            film.addEventListener('mouseleave', () => {
                preview.style.opacity = '0';
            });
        });
    </script>
</body>
</html>
