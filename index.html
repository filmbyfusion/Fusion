<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUSION | Production Co.</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            /* 3D CHROME TEXTURE: Uses a mix of sharp gradients and a noise overlay */
            background-color: #b8b8ba;
            background-image: 
                /* High-gloss 3D reflections */
                linear-gradient(135deg, 
                    #e0e0e2 0%, 
                    #ffffff 15%, 
                    #b8b8ba 30%, 
                    #7a7a7c 45%, 
                    #cfcfd1 60%, 
                    #ffffff 85%, 
                    #a1a1a3 100%),
                /* Subtle grain texture overlay */
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-blend-mode: soft-light;
            background-attachment: fixed;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        .nav {
            position: fixed;
            width: 100%;
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            /* Removed blur effect (backdrop-filter) */
            background: transparent; 
        }

        .logo {
            width: 476px; /* 1.7x Size */
            height: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 50px;
        }

        .nav-link {
            text-decoration: none;
            color: inherit;
            /* 1.4x Size Increase: 16px * 1.4 = ~22px */
            font-size: 22.4px; 
            letter-spacing: 2px;
            transition: 0.3s;
            opacity: 1; /* Full opacity to match film titles */
            font-weight: 700; /* Bold to match film titles */
            text-transform: uppercase;
        }

        /* Hover: Turns white with a glow, matching the film titles logic */
        .nav-link:hover {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255,255,255,0.6);
        }

        .main {
            padding: 450px 60px 100px;
            width: 60%;
        }

        .film-link {
            text-decoration: none;
            color: inherit;
        }

        .film {
            font-size: 48px;
            padding: 30px 0;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-bottom: 2px solid rgba(0,0,0,0.15); /* Slightly thicker border for 3D feel */
        }

        .film:hover {
            color: #ffffff; 
            transform: translateX(15px);
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        .year {
            font-size: 14px;
            margin-left: 15px;
            opacity: .6;
            font-weight: 400;
        }

        .preview {
            position: fixed;
            width: 520px;
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s ease;
            z-index: 100;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .preview img {
            width: 100%;
            display: block;
        }

        .footer {
            padding: 150px 60px 80px;
            font-size: 14px;
            letter-spacing: 2px;
        }

        @media(max-width:900px) {
            .logo { width: 280px; } 
            .nav-link { font-size: 18px; }
            .main { padding-top: 250px; width: 95%; }
            .film { font-size: 32px; }
            .preview { display: none; }
        }
    </style>
</head>
<body>

    <div class="nav">
        <img src="images/Fusionlogo_v2.png" alt="FUSION" class="logo">
        
        <div class="nav-links">
            <a href="#team" class="nav-link">TEAM</a>
            <a href="#footer-contact" class="nav-link">CONTACT</a>
        </div>
    </div>

    <div class="main">
        <a href="https://www.youtube.com/watch?v=cB0-g6u-kO4" target="_blank" class="film-link">
            <div class="film" data-img="images/RaymondLeigh.png">
                Raymond Leigh <span class="year">2026</span>
            </div>
        </a>
        <a href="https://vimeo.com/1122986082" target="_blank" class="film-link">
            <div class="film" data-img="images/Arlo.png">
                Arlo <span class="year">2025</span>
            </div>
        </a>
        <a href="https://www.youtube.com/watch?v=rN5POyiLMTM" target="_blank" class="film-link">
            <div class="film" data-img="images/Mutek.png">
                MUTEK <span class="year">2024</span>
            </div>
        </a>
    </div>

    <div class="preview" id="preview">
        <img src="" alt="Preview">
    </div>

    <div class="footer" id="footer-contact">
        <div id="team" style="margin-bottom: 40px; border-top: 2px solid rgba(0,0,0,0.15); padding-top: 40px;">
            <h3 style="margin-bottom: 10px; text-transform: uppercase;">TEAM</h3>
            <p style="opacity: 0.7;">Production Collective</p>
        </div>
        <p>filmbyfusion@gmail.com</p>
    </div>

    <script>
        const preview = document.getElementById('preview');
        const previewImg = preview.querySelector('img');
        const films = document.querySelectorAll('.film');

        window.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            requestAnimationFrame(() => {
                if (preview && preview.style.opacity === '1') {
                    const yOffset = preview.offsetHeight / 2;
                    preview.style.left = (x + 40) + 'px';
                    preview.style.top = (y - yOffset) + 'px';
                }
            });
        });

        films.forEach(film => {
            film.addEventListener('mouseenter', () => {
                const imgPath = film.getAttribute('data-img');
                previewImg.src = imgPath;
                preview.style.opacity = '1';
            });
            film.addEventListener('mouseleave', () => {
                preview.style.opacity = '0';
            });
        });
    </script>
</body>
</html>
